name: Windows Native Build & Artifact Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-nsis:
    name: Build Windows Native NSIS Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable (MSVC Target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Install Node Dependencies
        run: npm install --no-fund --no-audit

      - name: Generate Canonical Business Functions
        run: npm run generate

      - name: Run Windows Test Suite
        run: npm run test:windows

      - name: Build Web Application Frontend
        run: npm run build

      - name: Cargo Check Tauri Backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows NSIS Bundle
        run: npm run tauri build

      - name: Prepare Artifacts & Calculate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "windows-artifacts" | Out-Null
          $installer = Get-ChildItem -Path "src-tauri/target" -Filter "*setup.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path "src-tauri/target" -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -like "*bundle*nsis*" } | Select-Object -First 1
          }
          if (-not $installer) {
            Write-Error "No NSIS installer EXE artifact found in src-tauri/target/"
            exit 1
          }
          Copy-Item -Path $installer.FullName -Destination "windows-artifacts\"
          Copy-Item -Path "docs/guides/installation/WINDOWS_KURULUM_YARDIMI.txt" -Destination "windows-artifacts\"
          
          # Generate SHA256SUMS.txt
          $files = Get-ChildItem -Path "windows-artifacts" -File
          $hashes = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash
            "$h  $($f.Name)"
          }
          $hashes | Out-File -FilePath "windows-artifacts/SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem -Path "windows-artifacts"

      - name: Upload Windows NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERP-CRM-Discovery-Windows-Setup
          path: windows-artifacts/
          if-no-files-found: error
