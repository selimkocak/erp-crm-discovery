[package]
name = "erp-crm-discovery"
version = "0.1.0"
description = "ERP CRM Discovery Desktop Application"
authors = ["ERP CRM Discovery Team"]
edition = "2021"

[lib]
name = "erp_crm_discovery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
